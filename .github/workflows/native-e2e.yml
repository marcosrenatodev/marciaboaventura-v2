name: Native E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android emulator · onboarding and office flows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_CLI_NO_ANALYTICS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android development client
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
        run: |
          pnpm --filter @marcia/mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          archive="$RUNNER_TEMP/maestro-cli-${MAESTRO_VERSION}.zip"
          install_dir="$RUNNER_TEMP/maestro-dist"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/maestro/bin" >> "$GITHUB_PATH"
          "$install_dir/maestro/bin/maestro" --version

      - name: Start ephemeral D1 API and Metro
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
          CI: "1"
          EXPO_NO_DEV_MENU: "1"
          MARCIA_E2E_KEEP_DB: "1"
        run: |
          set -euo pipefail
          nohup node e2e/start-api.mjs > "$RUNNER_TEMP/marcia-api.log" 2>&1 < /dev/null &
          nohup pnpm --filter @marcia/mobile exec expo start --dev-client --host localhost --port 8081 \
            > "$RUNNER_TEMP/marcia-metro.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 180); do
            api_ready=0
            metro_status=""
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/auth/get-session >/dev/null; then
              api_ready=1
              metro_status="$(curl --fail --silent --max-time 2 http://127.0.0.1:8081/status || true)"
              if [[ "$metro_status" == *"packager-status:running"* ]]; then
                exit 0
              fi
            fi
            if (( attempt % 15 == 0 )); then
              echo "Waiting for local API and Metro (${attempt}/180; api_ready=${api_ready}; metro_status=${metro_status:-not ready})"
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/marcia-api.log"
          cat "$RUNNER_TEMP/marcia-metro.log"
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8081/status || true
          exit 1

      - name: Enable KVM for the Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Run rendered Android office journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 720x1600
            adb shell wm density 280
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:8787 tcp:8787
            adb shell appops set com.example.marciaescritorio.demo SYSTEM_ALERT_WINDOW allow
            adb shell "am start -a android.intent.action.VIEW -d 'marcia-demo://?__expo_url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1'"
            maestro test --device emulator-5554 -e APP_ID=com.example.marciaescritorio.demo --format=JUNIT --output="$RUNNER_TEMP/maestro-android.xml" --test-output-dir="$RUNNER_TEMP/maestro-android" .maestro/office-workspace.yaml

      - name: Upload Android E2E screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-e2e
          path: |
            ${{ runner.temp }}/maestro-android.xml
            ${{ runner.temp }}/maestro-android/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  ios-e2e:
    name: iOS simulator · office journey
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MAESTRO_CLI_NO_ANALYTICS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Java for Maestro
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iOS simulator development client
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
        run: |
          pnpm --filter @marcia/mobile exec expo prebuild --platform ios --no-install
          simulator_udid="$(xcrun simctl list devices available --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const devices = JSON.parse(input).devices;
              const simulator = Object.values(devices).flat().find((device) => device.isAvailable && device.name.startsWith("iPhone"));
              if (!simulator) process.exit(1);
              process.stdout.write(simulator.udid);
            });
          ')"
          echo "$simulator_udid" > "$RUNNER_TEMP/ios-simulator-udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          EXPO_PUBLIC_API_URL=http://127.0.0.1:8787 \
            pnpm --filter @marcia/mobile exec expo run:ios --no-bundler --device "$simulator_udid"

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          archive="$RUNNER_TEMP/maestro-cli-${MAESTRO_VERSION}.zip"
          install_dir="$RUNNER_TEMP/maestro-dist"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_SHA256}  ${archive}" | shasum --check --status
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/maestro/bin" >> "$GITHUB_PATH"
          "$install_dir/maestro/bin/maestro" --version

      - name: Start ephemeral D1 API and Metro
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
          CI: "1"
          EXPO_NO_DEV_MENU: "1"
          MARCIA_E2E_KEEP_DB: "1"
        run: |
          set -euo pipefail
          nohup node e2e/start-api.mjs > "$RUNNER_TEMP/marcia-api.log" 2>&1 < /dev/null &
          nohup pnpm --filter @marcia/mobile exec expo start --dev-client --host localhost --port 8081 \
            > "$RUNNER_TEMP/marcia-metro.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 180); do
            api_ready=0
            metro_status=""
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/auth/get-session >/dev/null; then
              api_ready=1
              metro_status="$(curl --fail --silent --max-time 2 http://127.0.0.1:8081/status || true)"
              if [[ "$metro_status" == *"packager-status:running"* ]]; then
                exit 0
              fi
            fi
            if (( attempt % 15 == 0 )); then
              echo "Waiting for local API and Metro (${attempt}/180; api_ready=${api_ready}; metro_status=${metro_status:-not ready})"
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/marcia-api.log"
          cat "$RUNNER_TEMP/marcia-metro.log"
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8081/status || true
          exit 1

      - name: Launch app bundle in the simulator
        run: |
          simulator_udid="$(cat "$RUNNER_TEMP/ios-simulator-udid")"
          manifest_url="$(node -e 'process.stdout.write(encodeURIComponent("http://127.0.0.1:8081"))')"
          launch_url="marcia-demo://?__expo_url=${manifest_url}&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1"
          xcrun simctl openurl "$simulator_udid" "$launch_url"

      - name: Run rendered iOS office journey
        run: |
          maestro test --device "$(cat "$RUNNER_TEMP/ios-simulator-udid")" \
            -e APP_ID=com.example.marciaescritorio.demo \
            --format=JUNIT \
            --output="$RUNNER_TEMP/maestro-ios.xml" \
            --test-output-dir="$RUNNER_TEMP/maestro-ios" \
            .maestro/office-workspace.yaml

      - name: Upload iOS E2E screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-e2e
          path: |
            ${{ runner.temp }}/maestro-ios.xml
            ${{ runner.temp }}/maestro-ios/**/*.png
          if-no-files-found: ignore
          retention-days: 7
