name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Check site
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - name: Check shared contracts
        run: pnpm --filter @marcia/contracts typecheck

      - name: Check API
        run: |
          pnpm test:api
          pnpm --filter @marcia/api typecheck
          pnpm --filter @marcia/api build

      - name: Check mobile app
        run: |
          pnpm check:brand-parity
          pnpm check:mobile-contrast
          pnpm --filter @marcia/mobile typecheck
          pnpm --filter @marcia/mobile lint
          pnpm --filter @marcia/mobile export:web
          pnpm check:mobile-bundle

      - name: Check E2E test types
        run: pnpm typecheck:e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run rendered Web E2E flows
        run: pnpm e2e:web

      - name: Save rendered E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-web-e2e-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
